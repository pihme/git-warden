# Lines to add to a Hermetarium habitat's gate file. Not a complete squid.conf,
# and not read by push-guard. See docs/push-guard.md, "Next to a Hermetarium habitat".
# The gate file, the stand-in name, and writing the address in before create
# are Hermetarium's: https://github.com/pihme/hermetarium/issues/12
#
# Replace the placeholders. Do not put a real password or a real token here.
#   <git stand-in host>       its own name for Git, not an existing model host
#                             (hermetarium#12, linked above)
#   <push guard address>      address the gate can open; the habitat cannot
#   <base64 of user:password> any word, a colon, and the trimmed password
#                             (no surrounding whitespace) from agent.token_file
#                             (for example /etc/warden/agent-token). Not the write credential.
# inbound is already defined in the gate file. Put the http_access line before
# that file's "http_access deny all".

acl githost dstdomain <git stand-in host>
cache_peer <push guard address> parent 8418 0 no-query no-digest originserver name=guard
cache_peer_access guard deny inbound
cache_peer_access guard allow githost
cache_peer_access guard deny all
request_header_access Authorization deny all
request_header_add Authorization "Basic <base64 of user:password>" githost !inbound
http_access allow githost
