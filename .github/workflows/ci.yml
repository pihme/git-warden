name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main: it may be cutting a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Install git-everref (pinned, SHA-256 checked)
        run: |
          scripts/install-everref.sh /usr/local/bin
          git-everref --version
      - name: Install sshd (for the SSH end-to-end test)
        run: command -v sshd || test -x /usr/sbin/sshd || (sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server)
      - run: go vet ./...
      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
        env:
          # the secret-scan, SSH and everref tests must run in CI, never skip silently
          GITLEAKS_REQUIRED: "1"
          SSH_REQUIRED: "1"
          EVERREF_REQUIRED: "1"
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        run: go tool cover -func=coverage.out | tee coverage.txt | tail -1
      - name: Upload coverage
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 14


  # Property tests and fuzz seeds under //go:build fuzz (rapid checks kept modest).
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz-tag tests (seeds + rapid)
        run: go test -tags=fuzz ./internal/config ./internal/journal ./internal/rules -rapid.checks=100

  # The Dockerfile builds, and the image has the pinned programs and refuses
  # to serve without a configuration (the Push Guard's preflight).
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t git-warden:ci --build-arg VERSION=ci .
      - name: Smoke test
        run: |
          docker run --rm git-warden:ci sh -c 'push-guard version && backup-guard version && git version && test "$(gitleaks version)" = 8.30.1 && test "$(git-everref --version)" = "everref version v1.0.0"'
          if docker run --rm git-warden:ci 2> serve.err; then echo "serve started without a configuration" >&2; exit 1; fi
          grep -F 'preflight failed: no wall configuration' serve.err

  # flake.nix: the package builds (with go test ./... in the sandbox) and the
  # dev shell has the pinned programs. Catches a stale vendorHash.
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#default
      - run: nix develop -c sh -c 'go version && git version && gitleaks version && git-everref --version'

  # Push Guard against this repository on GitHub. Only this job can write, and
  # the test only touches its own testrun-* branch, deleted at the end.
  # Workflows only run on pushes to main, so testrun-* pushes start nothing.
  live:
    needs: test
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Live test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARDEN_LIVE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          export WARDEN_LIVE_TOKEN_FILE="$RUNNER_TEMP/warden-token"
          (umask 077 && printf '%s\n' "$GH_TOKEN" > "$WARDEN_LIVE_TOKEN_FILE")
          go test -run '^TestLiveRemote$' -v ./cmd/push-guard/
      - name: Delete testrun branches older than a day
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y%m%dT%H%M%SZ)
          gh api "repos/${{ github.repository }}/git/matching-refs/heads/testrun-" --jq '.[].ref' |
          while read -r ref; do
            stamp=${ref#refs/heads/testrun-}; stamp=${stamp%%-*}
            if [[ "$stamp" < "$cutoff" ]]; then
              echo "deleting $ref"
              gh api -X DELETE "repos/${{ github.repository }}/git/$ref"
            fi
          done

  release:
    needs: [test, fuzz, container, nix, live]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tag and attach the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py
