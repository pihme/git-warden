name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main: it may be cutting a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: go vet ./...
      - run: go test ./...
        env:
          # the secret-scan tests must run in CI, never skip silently
          GITLEAKS_REQUIRED: "1"

  # Push Guard against this repository on GitHub. Only this job can write, and
  # the test only touches its own testrun-* branch, deleted at the end.
  # Workflows only run on pushes to main, so testrun-* pushes start nothing.
  live:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Live test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARDEN_LIVE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          export WARDEN_LIVE_TOKEN_FILE="$RUNNER_TEMP/warden-token"
          (umask 077 && printf '%s\n' "$GH_TOKEN" > "$WARDEN_LIVE_TOKEN_FILE")
          go test -run '^TestLiveRemote$' -v ./cmd/push-guard/
      - name: Delete testrun branches older than a day
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y%m%dT%H%M%SZ)
          gh api "repos/${{ github.repository }}/git/matching-refs/heads/testrun-" --jq '.[].ref' |
          while read -r ref; do
            stamp=${ref#refs/heads/testrun-}; stamp=${stamp%%-*}
            if [[ "$stamp" < "$cutoff" ]]; then
              echo "deleting $ref"
              gh api -X DELETE "repos/${{ github.repository }}/git/$ref"
            fi
          done

  release:
    needs: [test, live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tag and attach the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py
