# Commit prefixes follow the release rules in AGENTS.md (.github/scripts/release.py):
#   runtime deps, shipped Docker base images and Nix locks that are release inputs -> fix(deps): patch release
#   dev deps -> chore(deps-dev), GitHub Actions -> ci(deps), unshipped images and other Nix locks -> chore(deps): no release
# A Nix lock is a release input when CI builds a released artifact inside that Nix
# environment and the artifact depends on it (e.g. the Go toolchain of a released
# binary); it is then also a release path in .github/release.json.
# Here nix/reference-env/flake.lock is one (the release job builds both binaries with
# its Go toolchain). The nix block bumps all three shells in one commit, so it uses fix.
# Never reword a Dependabot title into feat! (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Dockerfile base images (pinned by digest). The image is not published,
  # so these are unshipped images: chore(deps), no release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]

  # All Nix shells in one block and one group: one bundled PR per run.
  # Add every extra shell (nix/<name>/flake.lock) under `directories:`.
  - package-ecosystem: nix
    directories:
      - /nix/reference-env
      - /nix/git-tools
      - /nix/scanners
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      # fix when a lock in this block is a release input (see above), otherwise chore.
      prefix: fix
      include: scope
    groups:
      nix:
        patterns: ["*"]
