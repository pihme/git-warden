# Commit prefixes follow the release rules in AGENTS.md (.github/scripts/release.py):
#   runtime deps, shipped Docker base images and Nix locks that are release inputs -> fix(deps): patch release
#   dev deps -> chore(deps-dev), GitHub Actions -> ci(deps), unshipped images and other Nix locks -> chore(deps): no release
# A Nix lock is a release input when CI builds a released artifact inside that Nix
# environment and the artifact depends on it (e.g. the Go toolchain of a released
# binary); it is then also a release path in .github/release.json.
# Here nix/reference-env/flake.lock is one (the release job builds both binaries with
# its Go toolchain), so it has its own nix block with fix; the other Nix locks use chore.
# Never reword a Dependabot title into feat! (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Dockerfile base images (pinned by digest). The image is not published,
  # so these are unshipped images: chore(deps), no release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]

  # Release-input Nix lock: nix/reference-env/flake.lock is a release path in
  # .github/release.json, so its bump is fix(deps) and cuts a patch release.
  - package-ecosystem: nix
    directories:
      - /nix/reference-env
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: fix
      include: scope
    groups:
      nix-release:
        patterns: ["*"]

  # All other Nix locks (root package flake, git-tools, scanners): no release input,
  # chore(deps), no release. One group: one bundled PR per run.
  # Add every extra shell (nix/<name>/flake.lock) under `directories:` of the matching block.
  - package-ecosystem: nix
    directories:
      - /
      - /nix/git-tools
      - /nix/scanners
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: chore
      include: scope
    groups:
      nix:
        patterns: ["*"]
